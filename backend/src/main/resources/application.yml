spring:
  application:
    name: investor-portfolio

  datasource:
    url: jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    "[com.enviro.assessment.junior]": DEBUG